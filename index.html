<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAKEBOOK – Chọn sách hay. Mở góc nhìn mới.</title>
<meta name="description" content="TakeBook là hiệu sách trực tuyến chọn lọc: khám phá sách mới, sách bán chạy và những bài viết đáng đọc.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap&subset=vietnamese" rel="stylesheet">
<!-- Tích hợp thư viện Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--cyan:#18B8C8;--orange:#C97543;--ivory:#F7F5EF;--white:#fff;--teal:#19363B;--muted:#64716D;--line:#E6E5DF;--orange-ink:#A85C30;--cyan-ink:#0B7F8B;
--bg:var(--ivory);--surface:var(--white);--text:var(--teal);--sp:8px;--r:6px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10262A;--surface:#17343A;--text:#F2EFE6;--muted:#A3B3AF;--line:#2A4A50;--cyan-ink:#4FD3E0;--orange-ink:#E39A70}}
:root[data-theme="dark"]{--bg:#10262A;--surface:#17343A;--text:#F2EFE6;--muted:#A3B3AF;--line:#2A4A50;--cyan-ink:#4FD3E0;--orange-ink:#E39A70}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.65 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
h1,h2,h3{margin:0;line-height:1.2}
.serif{font-family:"Playfair Display",Georgia,serif;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:var(--r);border:1px solid transparent;font:500 15px "Be Vietnam Pro",sans-serif;cursor:pointer;transition:background .2s,border-color .2s}
.btn-primary{background:var(--orange-ink);color:#fff}.btn-primary:hover{background:#8F4C26}
.btn-ghost{border-color:var(--text);color:var(--text);background:transparent}.btn-ghost:hover{border-color:var(--cyan);color:var(--cyan-ink)}
.note{background:var(--teal);color:#F7F5EF;font-size:13px;text-align:center;padding:6px 12px}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar{display:flex;align-items:center;gap:24px;min-height:68px}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:20px;letter-spacing:.04em}
nav{display:flex;gap:22px;font-size:15px;font-weight:500}
nav a{padding:6px 0;border-bottom:2px solid transparent}nav a:hover,nav a[aria-current]{border-color:var(--cyan)}
.search{flex:1;max-width:380px;margin-left:auto;position:relative}
.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:var(--r);padding:0 14px;background:var(--bg);color:var(--text);font:inherit;font-size:15px}
.icons{display:flex;gap:6px}.ib{position:relative;width:44px;height:44px;display:grid;place-items:center;background:none;border:0;color:var(--text);cursor:pointer;border-radius:var(--r)}
.ib:hover{background:var(--bg)}
.count{position:absolute;top:4px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--orange-ink);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.hero{padding:56px 0 64px}.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(34px,5.2vw,60px);margin-bottom:20px}
.hero p{color:var(--muted);font-size:17px;max-width:46ch;margin:0 0 28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.still{background:#EDE9DC;border-radius:var(--r);aspect-ratio:5/4;display:grid;place-items:end center;overflow:hidden}
.still svg{width:100%;height:100%}
section.s{padding:56px 0;border-top:1px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px;gap:16px}
.head h2{font-size:clamp(26px,3.4vw,36px)}.head a{color:var(--cyan-ink);font-weight:500;font-size:15px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;gap:16px;align-items:center;transition:border-color .2s}
.cat:hover{border-color:var(--cyan)}
.cat i{width:44px;height:58px;border-radius:2px 4px 4px 2px;flex:none;border-left:5px solid rgba(0,0,0,.18)}
.cat b{font-weight:500;display:block}.cat span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 20px}
.card{display:flex;flex-direction:column}
.cover{aspect-ratio:2/3;border-radius:2px 5px 5px 2px;border-left:6px solid rgba(0,0,0,.16);padding:18px 14px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:0 1px 2px rgba(25,54,59,.15);transition:transform .25s;background-size:cover;background-position:center}
.card:hover .cover{transform:translateY(-4px)}
.cover .t{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:19px;line-height:1.2;background:rgba(0,0,0,0.3);padding:2px 4px;border-radius:4px}.cover .a{font-size:11px;opacity:.9}
.tag{align-self:flex-start;margin-top:12px;font-size:12px;font-weight:600;color:var(--orange-ink);border:1px solid var(--orange-ink);border-radius:3px;padding:0 6px}
.card h3{font:500 15px/1.4 "Be Vietnam Pro";margin-top:12px}
.card .au{font-size:13px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.price{font-weight:600}
.add{min-height:40px;padding:0 14px;font-size:14px}
.col{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.colc{background:var(--teal);color:#F7F5EF;border-radius:var(--r);padding:28px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between}
.colc:nth-child(2){background:var(--surface);color:var(--text);border:1px solid var(--line)}
.colc h3{font-size:24px}.colc span{font-size:14px;opacity:.85}
.art{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.art .im{aspect-ratio:3/2;border-radius:var(--r);background:#DCE9E8;margin-bottom:14px}
.art small{color:var(--cyan-ink);font-weight:500}.art h3{font-size:20px;margin:4px 0 6px}.art p{margin:0;color:var(--muted);font-size:15px}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;font-size:15px}
.trust b{display:block;font-weight:600}.trust span{color:var(--muted);font-size:14px}
footer{background:var(--teal);color:#DCE5E3;padding:48px 0 32px;font-size:14px}
.fg{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:32px}
footer h4{margin:0 0 10px;color:#fff;font-weight:600;font-size:15px}footer a{display:block;padding:3px 0}footer a:hover{color:var(--cyan)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--teal);color:#fff;padding:12px 18px;border-radius:var(--r);opacity:0;pointer-events:none;transition:.25s;z-index:50;font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{grid-column:1/-1;color:var(--muted);padding:24px 0}
.mnav{display:none}
#view{padding:28px 20px 64px;max-width:1240px;margin:0 auto}#view:focus{outline:none}
.crumb{font-size:14px;color:var(--muted);margin-bottom:16px}.crumb a{color:var(--cyan-ink)}
.ttl{font-size:clamp(28px,4vw,40px);margin-bottom:6px}.sub,.mut{color:var(--muted);font-size:14px}
.shop{display:grid;gap:28px;margin-top:24px}
.ff{display:grid;gap:14px;align-content:start;font-size:14px;font-weight:500}
.ff select,.ff input[type=search],.fl input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--text);font:inherit;font-weight:400;padding:0 12px;margin-top:4px}
.ff .ck{display:flex;gap:8px;align-items:center}.ff .ck input{width:18px;height:18px;margin:0}
.rc{color:var(--muted);font-size:14px;margin-bottom:14px}
.det{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:40px;margin-bottom:56px}.dc{max-width:320px}
.big{font-size:24px;margin:8px 0}.stk{font-size:14px;font-weight:500}.stk.ok{color:var(--cyan-ink)}.stk.no{color:var(--orange-ink)}
.buy{display:flex;gap:12px;margin:16px 0}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.qty button{width:40px;height:44px;border:0;background:none;color:var(--text);font-size:18px;cursor:pointer}.qty input{width:48px;height:44px;border:0;text-align:center;background:none;color:var(--text);font:inherit}.qty span{min-width:32px;text-align:center}
.dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:15px}.dl dt{color:var(--muted)}.dl dd{margin:0}
.rel{font-size:28px;margin-bottom:20px}
.cw{display:grid;gap:32px;margin-top:20px}
.cr{display:grid;grid-template-columns:56px 1fr auto auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.mini{padding:6px 4px;border-left-width:3px}.mini .t{font-size:8px}.mini .a{display:none}
.lnk{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:14px;min-height:44px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;align-self:start;display:grid;gap:12px}
.sum h2{font-size:18px}.sr2{display:flex;justify-content:space-between;gap:12px}
.fl{margin-bottom:14px}.fl label{font-weight:500;font-size:14px}.err{color:var(--orange-ink);font-size:13px}
.fl input[aria-invalid=true]{border-color:var(--orange-ink)}
.stp{display:flex;gap:8px;list-style:none;padding:0;margin:20px 0 0;counter-reset:s;font-size:14px;flex-wrap:wrap}
.stp li{counter-increment:s;display:flex;align-items:center;gap:8px;color:var(--muted);margin-right:12px}
.stp li:before{content:counter(s);width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px}
.stp li[aria-current]{color:var(--text);font-weight:600}.stp li[aria-current]:before{background:var(--text);border-color:var(--text);color:var(--bg)}
.stp li.dn:before{content:"✓";border-color:var(--cyan);color:var(--cyan-ink)}
fieldset{border:1px solid var(--line);border-radius:var(--r);margin:0 0 16px;padding:10px 16px}legend{font-weight:600;padding:0 6px}
.rd{display:flex;gap:10px;align-items:center;min-height:44px}.rd input{width:18px;height:18px;margin:0}
.rv{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:12px 0}.rv p{margin:4px 0 0;color:var(--muted);font-size:15px}
.acts{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
@media(min-width:981px){.shop{grid-template-columns:240px 1fr}.shop .grid{grid-template-columns:repeat(3,1fr)}.cw{grid-template-columns:1fr 340px}}
@media(max-width:700px){.det{grid-template-columns:1fr;gap:24px}.dc{max-width:200px}.cr{grid-template-columns:48px 1fr auto}.cr .lnk{grid-column:2/4;justify-self:start;min-height:32px}.buy{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--bg);padding:10px 0;z-index:5}.dl{grid-template-columns:110px 1fr}}
@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}.cats,.col,.art{grid-template-columns:1fr 1fr}.trust{grid-template-columns:1fr 1fr}.fg{grid-template-columns:1fr 1fr}nav{display:none}.mnav{display:flex;gap:18px;overflow-x:auto;padding:0 20px 10px;font-size:14px;font-weight:500;
